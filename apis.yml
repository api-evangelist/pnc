      - United States
      - Treasury Management
    properties:
      - type: Documentation
        url: https://developer.pnc.com/
      - type: SignupURL
        url: https://developer.pnc.com/
  - aid: pnc:consumer-data-access-akoya
    name: PNC Consumer Data Access API (Akoya)
    description: >-
      Consumer open-finance data-access surface through which PNC lets its retail customers
      securely permission and share account data with third-party financial apps without
      handing over login credentials. PNC delivers this through an Akoya-provided tokenized
      data-access API and, since a September 2024 bilateral data-access agreement, connects
      Plaid to that same Akoya API. This aggregator-mediated posture is PNC's stated path
      toward CFPB Section 1033 personal-financial-data-rights compliance. Access is via the
      Akoya data-access network and PNC's aggregator agreements rather than a self-serve
      public portal.
    humanURL: https://pnc.mediaroom.com/2024-09-20-PNC-Financial-Services-Group,-Plaid-Enter-Data-Access-Agreement
    tags:
      - Open Finance
      - Data Access
      - CFPB 1033
      - Akoya
      - United States
    properties:
