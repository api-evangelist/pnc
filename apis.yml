aid: pnc
name: PNC
description: >-
  PNC Financial Services Group is a Pittsburgh-based money-center bank and Fortune
  500 diversified financial services company offering retail banking, corporate and
  institutional banking, treasury management, asset management, and residential
  mortgage banking across the United States. PNC operates a real first-party developer
  portal at developer.pnc.com ("PNC Developer Tools: Open APIs for Banking & Payments")
  that publishes a catalog of treasury and payments API products — including Account
  Verification Services, ePayments, Real-Time Payments (RTP), Direct-to-Debit-Card
  (push-to-card) disbursement, and information reporting — surfaced through its PINACLE
  commercial banking platform and PINACLE Connect embedded-banking integrations. Full
  API reference documentation, sandbox/testing environments, and call codes are gated
  behind credentialed onboarding arranged through a PNC Relationship Manager or Treasury
  Management Officer; no OpenAPI/Swagger specifications are publicly downloadable. On the
  consumer open-finance side, PNC exposes account data through an Akoya-provided tokenized
  data-access API and signed a bilateral data-access agreement with Plaid in September 2024,
  positioning PNC ahead of CFPB Section 1033 personal-financial-data-rights requirements.
