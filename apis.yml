apis:
  - aid: pnc:account-verification-services
    name: PNC Account Verification Services API
    description: >-
      Account Verification Services API from PNC's developer portal for confirming
      the ownership and status of bank accounts before disbursing or collecting funds,
      helping corporate and institutional clients prevent payment fraud and reduce
      returns. Documented on developer.pnc.com with a business product sheet and
      developer guide; production access, sandbox, and call codes require credentialed
      onboarding through a PNC Relationship Manager or Treasury Management Officer.
    humanURL: https://developer.pnc.com/documentation/products/Account-Verification-Services/overview
    tags:
      - Account Verification
      - Fraud Prevention
      - United States
      - Payments
    properties:
      - type: Documentation
        url: https://developer.pnc.com/documentation/products/Account-Verification-Services/overview
      - type: SignupURL
        url: https://developer.pnc.com/
  - aid: pnc:epayments
    name: PNC ePayments API
    description: >-
      ePayments API from PNC's developer portal for programmatically initiating and
      tracking electronic payments — including ACH, wire transfers, and Real-Time
      Payments (RTP) — from client and ERP systems into PNC treasury services. Part of
      PNC's PINACLE Connect embedded-banking capability. Documented on developer.pnc.com;
      full reference, sandbox, and credentials are provisioned through a PNC Relationship
      Manager or Treasury Management Officer.
    humanURL: https://developer.pnc.com/documentation/products/ePayments/overview
    tags:
      - Payments
      - ACH
      - Wire Transfer
      - United States
      - Treasury Management
    properties:
      - type: Documentation
        url: https://developer.pnc.com/documentation/products/ePayments/overview
      - type: SignupURL
        url: https://developer.pnc.com/
  - aid: pnc:real-time-payments
    name: PNC Real-Time Payments (RTP) API
    description: >-
      Real-Time Payments API surface from PNC, one of the first U.S. banks to adopt The
      Clearing House RTP network. PNC has built RTP-related APIs that let clients embed
      instant, 24/7/365 credit-push payments and request-for-payment flows into their own
      systems. Documented within the PNC developer portal's treasury/payments catalog;
      production access and sandbox are gated behind Relationship Manager / Treasury
      Management Officer onboarding, and no public OpenAPI specification is downloadable.
    humanURL: https://developer.pnc.com/
    tags:
      - Real-Time Payments
      - Payments
      - United States
      - Instant Payments
      - Treasury Management
    properties:
      - type: Documentation
        url: https://developer.pnc.com/
      - type: SignupURL
        url: https://developer.pnc.com/
  - aid: pnc:direct-to-debit-card
    name: PNC Direct-to-Debit-Card (Push-to-Card) API
    description: >-
      Direct-to-Debit-Card (DTD) API from PNC providing an efficient option for
      business-to-consumer (B2C) fund disbursement by pushing payments directly to a
      recipient's debit card. Documented as part of PNC's treasury/payments API catalog
      on developer.pnc.com; access, sandbox, and credentials are arranged through a PNC
      Relationship Manager or Treasury Management Officer. No public OpenAPI specification
      is available for download.
    humanURL: https://developer.pnc.com/
    tags:
      - Push to Card
      - Disbursements
      - Payments
      - United States
      - B2C
    properties:
      - type: Documentation
        url: https://developer.pnc.com/
      - type: SignupURL
        url: https://developer.pnc.com/
  - aid: pnc:information-reporting
    name: PNC Information Reporting API
    description: >-
      Information reporting API surface from PNC for programmatic, near-real-time access
      to account balances, transaction history, and account detail across a client's PNC
      treasury accounts, supporting cash positioning and reconciliation. Documented within
      the PNC developer portal alongside the payments products; full reference, sandbox, and
      call codes require credentialed onboarding through a PNC Relationship Manager or
      Treasury Management Officer. No public OpenAPI specification is downloadable.
    humanURL: https://developer.pnc.com/
    tags:
      - Information Reporting
      - Balances
      - Transaction
      - United States
      - Treasury Management
    tags_raw:
      - Information Reporting
